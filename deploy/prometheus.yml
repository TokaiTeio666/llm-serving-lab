global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          service: gateway

  - job_name: model-a
    metrics_path: /metrics
    static_configs:
      - targets: ["model-a:8101"]
        labels:
          service: model-a

  - job_name: model-b
    metrics_path: /metrics
    static_configs:
      - targets: ["model-b:8102"]
        labels:
          service: model-b

  # Only present in the vLLM profile. vLLM exposes engine-level metrics:
  # num_requests_waiting, gpu_cache_usage_perc, time_to_first_token_seconds.
  # Those are what tell you where the real capacity ceiling is.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]
        labels:
          service: vllm

  # vLLM hosted in WSL2 (GPU passthrough). Reachable from the container via
  # the Windows host. This is where the engine-level capacity signals live:
  # num_requests_waiting, kv_cache_usage_perc, preemptions.
  - job_name: vllm-wsl
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: vllm
          instance: big-model
      - targets: ["host.docker.internal:8002"]
        labels:
          service: vllm
          instance: small-model

